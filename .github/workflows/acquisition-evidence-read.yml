name: Bounded acquisition evidence owner read
on:
  push:
    branches: [feat/acquisition-evidence-read-20261025]
  pull_request:
    paths:
      - '**/AcquisitionEvidence*'
      - '**/GatewayReadReceiptVerifier*'
      - '**/IngestionGatewayReadSecurityConfiguration.java'
      - '.github/workflows/acquisition-evidence-read.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  owner-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: ouf_ingestion, POSTGRES_USER: ouf_ingestion, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_ingestion -d ouf_ingestion" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_ING_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_ingestion
      OUF_ING_DB_USER: ouf_ingestion
      OUF_ING_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: bash scripts/install-authorization-sdk.sh
      - name: Verify actual read transaction, owner filtering, receipt scopes and existing ACK semantics
        run: mvn -B -ntp -Dtest=AcquisitionEvidenceRuntimeTest,AcquisitionEvidenceApiTest,GatewayReadReceiptVerifierTest,DurableAckTest test
      - name: Retain direct evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'acquisition-evidence-owner-${{ github.run_id }}', path: target/surefire-reports/, retention-days: 30}
