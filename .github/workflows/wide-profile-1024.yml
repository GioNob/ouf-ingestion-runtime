name: Wide managed CSV ingestion
on:
  push:
    branches: [feat/managed-profile-1024-20261107]
  pull_request:
    paths: ['src/**', '.github/workflows/wide-profile-1024.yml']
permissions: {contents: read}
jobs:
  wide-csv:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: bash scripts/install-authorization-sdk.sh
      - run: mvn -B -ntp -DargLine=-Xmx384m -Dtest=ManagedTabularAdapterTest test
