apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "ouf-ingestion.name" . }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ include "ouf-ingestion.name" . }}}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.ingressNamespaceLabels | indent 14 }}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.platformNamespaceLabels | indent 14 }}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 5432}]
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
