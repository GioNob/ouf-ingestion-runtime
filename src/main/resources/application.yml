spring:
  application.name: ouf-ingestion-runtime
  datasource:
    url: ${OUF_ING_DB_URL}
    username: ${OUF_ING_DB_USER}
    password: ${OUF_ING_DB_PASSWORD}
  flyway:
    schemas: ouf_ingestion
    default-schema: ouf_ingestion
    create-schemas: true
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,ingestionReadiness
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s


ouf.ingestion.iam:
  enabled: ${OUF_ING_IAM_ENABLED:false}
  issuer: ${OUF_ING_IAM_ISSUER:}
  audience: ${OUF_ING_IAM_AUDIENCE:}
